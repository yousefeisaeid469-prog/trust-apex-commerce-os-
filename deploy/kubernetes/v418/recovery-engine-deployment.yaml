apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-commerce-recovery-engine
  labels:
    app: trust-commerce-recovery-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trust-commerce-recovery-engine
  template:
    metadata:
      labels:
        app: trust-commerce-recovery-engine
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: recovery-engine
          image: ${TRUST_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/v418_recovery_engine_worker.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trust-database
                  key: DATABASE_URL
            - name: TRUST_V418_RECOVERY_BATCH
              value: "10"
          readinessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
