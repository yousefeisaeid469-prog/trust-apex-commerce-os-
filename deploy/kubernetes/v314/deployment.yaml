apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-api
  labels: {app: trust-api, version: v314}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: trust-api}}
  template:
    metadata: {labels: {app: trust-api, version: v314}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: trust-api
          image: trust-apex-os:314.0.0
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 15, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
