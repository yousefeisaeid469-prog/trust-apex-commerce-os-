apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: trust-deployment-controller}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: trust-deployment-controller}
subjects:
  - kind: ServiceAccount
    name: trust-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trust-deployment-controller
