apiVersion: v1
kind: ServiceAccount
metadata: {name: trust-control-plane}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-control-plane
spec:
  replicas: 2
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app: trust-control-plane}}
  template:
    metadata: {labels: {app: trust-control-plane}}
    spec:
      serviceAccountName: trust-control-plane
      containers:
        - name: app
          image: YOUR_REGISTRY/trust-apex-os:163.0.0
          ports: [{containerPort: 3000}]
          env:
            - name: DATABASE_URL
              value: postgresql://trust:REPLACE@trust-postgres:5432/trust
            - name: TRUST_REQUIRE_TLS
              value: "true"
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 15, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
