apiVersion: v1
kind: ConfigMap
metadata: {name: trust-otel-config}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: 0.0.0.0:4318}
    processors: {batch: {}}
    exporters: {debug: {verbosity: basic}}
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trust-otel}
spec:
  replicas: 1
  selector: {matchLabels: {app: trust-otel}}
  template:
    metadata: {labels: {app: trust-otel}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.133.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports: [{containerPort: 4318}]
          volumeMounts: [{name: config, mountPath: /etc/otelcol}]
      volumes: [{name: config, configMap: {name: trust-otel-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: trust-otel}
spec:
  selector: {app: trust-otel}
  ports: [{port: 4318, targetPort: 4318}]
