services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trust_verification
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust_verification"]
      interval: 3s
      timeout: 3s
      retries: 20
