services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trust
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust_local_dev
    ports: ["5432:5432"]
    volumes: [trust_pg_local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  trust_pg_local:
